name: Build Protected Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip base Android project
        run: |
          unzip -o AlkafelLiveTV_WhatsApp_Direct.zip -d project
          test -d project/AlkafelLiveTV

      - name: Prepare audio folder
        run: |
          mkdir -p project/AlkafelLiveTV/app/src/main/res/raw

      - name: Copy audio files
        run: |
          cp dua_faraj.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp dua_sabah.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp dua_tawassul.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_amin_allah.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_ashura.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_warith.mp3 project/AlkafelLiveTV/app/src/main/res/raw/

      - name: Apply audio page patch
        run: |
          unzip -o AlkafelLiveTV_AudioPatch.zip -d audio_patch
          cp audio_patch/ZiyaratActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/ZiyaratActivity.java

      - name: Apply poster images
        run: |
          unzip -o AlkafelLiveTV_PostersPatch.zip -d posters_patch
          mkdir -p project/AlkafelLiveTV/app/src/main/res/drawable-nodpi
          cp posters_patch/drawable-nodpi/* \
            project/AlkafelLiveTV/app/src/main/res/drawable-nodpi/

      - name: Apply media squares
        run: |
          unzip -o AlkafelLiveTV_MediaSquares_Patch.zip -d media_patch

          cp media_patch/app/src/main/java/tv/alkafel/live/MainActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/MainActivity.java

          cp media_patch/app/src/main/java/tv/alkafel/live/ProgramsActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/ProgramsActivity.java

          cp media_patch/app/src/main/AndroidManifest.xml \
            project/AlkafelLiveTV/app/src/main/AndroidManifest.xml

      - name: Apply WhatsApp MainActivity
        run: |
          unzip -o AlkafelLiveTV_MainActivity_WhatsApp_Toggle.zip -d whatsapp_main

          cp whatsapp_main/app/src/main/java/tv/alkafel/live/MainActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/MainActivity.java

      - name: Apply posters 1 2 3
        run: |
          unzip -o AlkafelLiveTV_Posters_123_Thumbnails_Patch.zip -d posters123

          cp posters123/app/src/main/java/tv/alkafel/live/PosterActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/PosterActivity.java

      - name: Change Prayer Location to Karbala
        run: |
          find project/AlkafelLiveTV -type f \
            \( -name "*.java" -o -name "*.xml" -o -name "*.json" \) \
            -print0 | \
          xargs -0 sed -i \
            -e 's/البحرين - المنامة/العراق - كربلاء/g' \
            -e 's/city=Manama\&country=Bahrain/city=Karbala\&country=Iraq/g'

      - name: Add R8 protection
        run: |
          cat > project/AlkafelLiveTV/app/proguard-rules.pro <<'EOF'
          -keep public class tv.alkafel.live.MainActivity { *; }
          -keep public class tv.alkafel.live.ZiyaratActivity { *; }
          -keep public class tv.alkafel.live.PosterActivity { *; }
          -keep public class tv.alkafel.live.ProgramsActivity { *; }

          -keep class androidx.media3.** { *; }
          -dontwarn androidx.media3.**

          -keep class tv.alkafel.live.** extends android.app.Activity { *; }
          EOF

      - name: Enable R8
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "project/AlkafelLiveTV/app/build.gradle"
          )

          if not p.exists():
              p = Path(
                  "project/AlkafelLiveTV/app/build.gradle.kts"
              )

          text = p.read_text()

          if "minifyEnabled true" in text:
              text = text.replace(
                  "minifyEnabled true",
                  "minifyEnabled true"
              )
          elif "minifyEnabled = true" not in text:
              text = text.replace(
                  "release {",
                  "release {\n            minifyEnabled = true\n            shrinkResources = true",
                  1
              )

          p.write_text(text)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        working-directory: project/AlkafelLiveTV
        run: gradle assembleRelease

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: Alkafel-Live-TV-Protected-Release
          path: project/AlkafelLiveTV/app/build/outputs/apk/release/app-release.apk
