name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o AlkafelLiveTV_WhatsApp_Direct.zip -d project
          test -d project/AlkafelLiveTV

      - name: Prepare audio folder
        run: |
          mkdir -p project/AlkafelLiveTV/app/src/main/res/raw

      - name: Copy audio files
        run: |
          cp dua_faraj.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp dua_sabah.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp dua_tawassul.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_amin_allah.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_ashura.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_warith.mp3 project/AlkafelLiveTV/app/src/main/res/raw/

      - name: Apply audio page patch
        run: |
          unzip -o AlkafelLiveTV_AudioPatch.zip -d audio_patch
          cp audio_patch/ZiyaratActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/ZiyaratActivity.java

      - name: Apply poster images
        run: |
          unzip -o AlkafelLiveTV_PostersPatch.zip -d posters_patch
          mkdir -p project/AlkafelLiveTV/app/src/main/res/drawable-nodpi
          cp posters_patch/drawable-nodpi/* \
            project/AlkafelLiveTV/app/src/main/res/drawable-nodpi/

      - name: Apply media squares
        run: |
          unzip -o AlkafelLiveTV_MediaSquares_Patch.zip -d media_patch

          cp media_patch/app/src/main/java/tv/alkafel/live/MainActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/MainActivity.java

          cp media_patch/app/src/main/java/tv/alkafel/live/ProgramsActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/ProgramsActivity.java

          cp media_patch/app/src/main/AndroidManifest.xml \
            project/AlkafelLiveTV/app/src/main/AndroidManifest.xml

      - name: Apply WhatsApp MainActivity
        run: |
          unzip -o AlkafelLiveTV_MainActivity_WhatsApp_Toggle.zip -d whatsapp_main

          cp whatsapp_main/app/src/main/java/tv/alkafel/live/MainActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/MainActivity.java

      - name: Apply posters 1 2 3
        run: |
          unzip -o AlkafelLiveTV_Posters_123_Thumbnails_Patch.zip -d posters123

          cp posters123/app/src/main/java/tv/alkafel/live/PosterActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/PosterActivity.java

      - name: Change Prayer Location to Karbala
        run: |
          find project/AlkafelLiveTV -type f \
            \( -name "*.java" -o -name "*.xml" -o -name "*.json" \) \
            -print0 |
          xargs -0 sed -i \
            -e 's/البحرين - المنامة/العراق - كربلاء/g' \
            -e 's/city=Manama\&country=Bahrain/city=Karbala\&country=Iraq/g'

      - name: Add R8 protection
        run: |
          cat > project/AlkafelLiveTV/app/proguard-rules.pro <<'EOF'
          -keep public class tv.alkafel.live.MainActivity { *; }
          -keep public class tv.alkafel.live.ZiyaratActivity { *; }
          -keep public class tv.alkafel.live.PosterActivity { *; }
          -keep public class tv.alkafel.live.ProgramsActivity { *; }

          -keep class androidx.media3.** { *; }
          -dontwarn androidx.media3.**

          -keep class tv.alkafel.live.** extends android.app.Activity { *; }
          EOF

      - name: Enable R8
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/AlkafelLiveTV/app/build.gradle")

          if not p.exists():
              p = Path("project/AlkafelLiveTV/app/build.gradle.kts")

          text = p.read_text()

          if "minifyEnabled true" not in text and "isMinifyEnabled = true" not in text:
              if "release {" in text:
                  text = text.replace(
                      "release {",
                      "release {\n            minifyEnabled true\n            shrinkResources true",
                      1
                  )

          p.write_text(text)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==========================================
      # SIGNING
      # ==========================================

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > project/AlkafelLiveTV/alkafel-release-key.jks
          test -s project/AlkafelLiveTV/alkafel-release-key.jks

      - name: Configure Android signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/AlkafelLiveTV/app/build.gradle")

          if not p.exists():
              raise SystemExit("app/build.gradle not found")

          text = p.read_text()

          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("../alkafel-release-key.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          # Add signingConfigs before buildTypes
          if "signingConfigs {" not in text:
              if "buildTypes {" in text:
                  text = text.replace(
                      "buildTypes {",
                      signing_config + "\n    buildTypes {",
                      1
                  )
              else:
                  raise SystemExit("buildTypes block not found")

          # Add signingConfig ONLY inside buildTypes -> release
          if "signingConfig signingConfigs.release" not in text:

              buildtypes_pos = text.find("buildTypes {")

              if buildtypes_pos == -1:
                  raise SystemExit("buildTypes block not found")

              release_pos = text.find("release {", buildtypes_pos)

              if release_pos == -1:
                  raise SystemExit("release build type not found")

              insert_pos = release_pos + len("release {")

              text = (
                  text[:insert_pos]
                  + "\n            signingConfig signingConfigs.release"
                  + text[insert_pos:]
              )

          p.write_text(text)
          PY

      - name: Verify signing configuration
        run: |
          echo "Checking signing configuration..."
          test -f project/AlkafelLiveTV/alkafel-release-key.jks
          grep -n "signingConfigs" project/AlkafelLiveTV/app/build.gradle
          grep -n "signingConfig signingConfigs.release" project/AlkafelLiveTV/app/build.gradle

      # ==========================================
      # BUILD SIGNED APK
      # ==========================================

      - name: Build Signed Release APK
        working-directory: project/AlkafelLiveTV
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."
          find project/AlkafelLiveTV/app/build/outputs/apk/release \
            -type f -name "*.apk" -print

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Alkafel-Live-TV-Signed-Release
          path: project/AlkafelLiveTV/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
