name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # ANDROID PROJECT
      # ==============================

      - name: Unzip Android project
        run: |
          unzip -o AlkafelLiveTV_WhatsApp_Direct.zip -d project
          test -d project/AlkafelLiveTV

      - name: Prepare audio folder
        run: |
          mkdir -p project/AlkafelLiveTV/app/src/main/res/raw

      - name: Copy audio files
        run: |
          cp dua_faraj.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp dua_sabah.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp dua_tawassul.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_amin_allah.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_ashura.mp3 project/AlkafelLiveTV/app/src/main/res/raw/
          cp ziyarat_warith.mp3 project/AlkafelLiveTV/app/src/main/res/raw/

      - name: Apply audio page patch
        run: |
          unzip -o AlkafelLiveTV_AudioPatch.zip -d audio_patch
          cp audio_patch/ZiyaratActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/ZiyaratActivity.java

      - name: Apply poster images
        run: |
          unzip -o AlkafelLiveTV_PostersPatch.zip -d posters_patch
          mkdir -p project/AlkafelLiveTV/app/src/main/res/drawable-nodpi
          cp posters_patch/drawable-nodpi/* \
            project/AlkafelLiveTV/app/src/main/res/drawable-nodpi/

      - name: Apply media squares
        run: |
          unzip -o AlkafelLiveTV_MediaSquares_Patch.zip -d media_patch

          cp media_patch/app/src/main/java/tv/alkafel/live/MainActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/MainActivity.java

          cp media_patch/app/src/main/java/tv/alkafel/live/ProgramsActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/ProgramsActivity.java

          cp media_patch/app/src/main/AndroidManifest.xml \
            project/AlkafelLiveTV/app/src/main/AndroidManifest.xml

      - name: Apply WhatsApp MainActivity
        run: |
          unzip -o AlkafelLiveTV_MainActivity_WhatsApp_Toggle.zip -d whatsapp_main

          cp whatsapp_main/app/src/main/java/tv/alkafel/live/MainActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/MainActivity.java

      - name: Apply posters 1 2 3
        run: |
          unzip -o AlkafelLiveTV_Posters_123_Thumbnails_Patch.zip -d posters123

          cp posters123/app/src/main/java/tv/alkafel/live/PosterActivity.java \
            project/AlkafelLiveTV/app/src/main/java/tv/alkafel/live/PosterActivity.java

      # ==============================
      # PRAYER LOCATION
      # ==============================

      - name: Change Prayer Location to Karbala
        run: |
          find project/AlkafelLiveTV -type f \
            \( -name "*.java" -o -name "*.xml" -o -name "*.json" \) \
            -print0 |
          xargs -0 sed -i \
            -e 's/البحرين - المنامة/العراق - كربلاء/g' \
            -e 's/city=Manama\&country=Bahrain/city=Karbala\&country=Iraq/g'

      # ==============================
      # R8
      # ==============================

      - name: Add R8 protection
        run: |
          cat > project/AlkafelLiveTV/app/proguard-rules.pro <<'EOF'
          -keep public class tv.alkafel.live.MainActivity { *; }
          -keep public class tv.alkafel.live.ZiyaratActivity { *; }
          -keep public class tv.alkafel.live.PosterActivity { *; }
          -keep public class tv.alkafel.live.ProgramsActivity { *; }

          -keep class androidx.media3.** { *; }
          -dontwarn androidx.media3.**

          -keep class tv.alkafel.live.** extends android.app.Activity { *; }
          EOF

      # ==============================
      # JAVA / GRADLE
      # ==============================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ==============================
      # SIGNING KEYSTORE
      # ==============================

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n \t' \
            | base64 -d \
            > project/AlkafelLiveTV/alkafel-release-key.jks

          test -s project/AlkafelLiveTV/alkafel-release-key.jks

          echo "Keystore restored successfully."

      # ==============================
      # VERIFY KEYSTORE
      # ==============================

      - name: Verify keystore password and alias
        working-directory: project/AlkafelLiveTV
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"

          keytool -list \
            -keystore alkafel-release-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore password and alias are valid."

      # ==============================
      # CONFIGURE SIGNING
      # ==============================

      - name: Configure Android signing
        working-directory: project/AlkafelLiveTV
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("app/build.gradle")
          kotlin = Path("app/build.gradle.kts")

          if groovy.exists():

              text = groovy.read_text()

              signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("../alkafel-release-key.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              '''

              if 'storeFile file("../alkafel-release-key.jks")' not in text:

                  match = re.search(r'android\s*\{', text)

                  if not match:
                      raise SystemExit("android block not found")

                  pos = match.end()
                  text = text[:pos] + "\n" + signing_block + text[pos:]

              if "signingConfig signingConfigs.release" not in text:

                  pattern = r'(buildTypes\s*\{[\s\S]*?release\s*\{)'

                  replacement = (
                      r'\1'
                      '\n            signingConfig signingConfigs.release'
                  )

                  text, count = re.subn(
                      pattern,
                      replacement,
                      text,
                      count=1
                  )

                  if count == 0:
                      raise SystemExit("release buildType not found")

              groovy.write_text(text)

              print("Groovy signing configuration completed.")

          elif kotlin.exists():

              text = kotlin.read_text()

              signing_block = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("../alkafel-release-key.jks")
                      storePassword = System.getenv("STORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              '''

              if "alkafel-release-key.jks" not in text:

                  match = re.search(r'android\s*\{', text)

                  if not match:
                      raise SystemExit("android block not found")

                  pos = match.end()
                  text = text[:pos] + "\n" + signing_block + text[pos:]

              if 'signingConfig = signingConfigs.getByName("release")' not in text:

                  pattern = r'(buildTypes\s*\{[\s\S]*?release\s*\{)'

                  replacement = (
                      r'\1'
                      '\n            signingConfig = signingConfigs.getByName("release")'
                  )

                  text, count = re.subn(
                      pattern,
                      replacement,
                      text,
                      count=1
                  )

                  if count == 0:
                      raise SystemExit("release buildType not found")

              kotlin.write_text(text)

              print("Kotlin signing configuration completed.")

          else:
              raise SystemExit(
                  "ERROR: app/build.gradle or app/build.gradle.kts not found"
              )
          PY

      # ==============================
      # VERIFY SIGNING
      # ==============================

      - name: Verify signing configuration
        working-directory: project/AlkafelLiveTV
        run: |
          test -f alkafel-release-key.jks

          echo "Checking Gradle files..."

          if [ -f app/build.gradle ]; then
            echo "Found app/build.gradle"
            grep -n "alkafel-release-key.jks" app/build.gradle || true
            grep -n "signingConfig" app/build.gradle || true
          fi

          if [ -f app/build.gradle.kts ]; then
            echo "Found app/build.gradle.kts"
            grep -n "alkafel-release-key.jks" app/build.gradle.kts || true
            grep -n "signingConfig" app/build.gradle.kts || true
          fi

          echo "Signing verification completed."

      # ==============================
      # BUILD SIGNED APK
      # ==============================

      - name: Build Signed Release APK
        working-directory: project/AlkafelLiveTV
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace

      # ==============================
      # FIND APK
      # ==============================

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."

          find project/AlkafelLiveTV/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

      # ==============================
      # UPLOAD APK
      # ==============================

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Alkafel-Live-TV-Signed-Release
          path: project/AlkafelLiveTV/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
